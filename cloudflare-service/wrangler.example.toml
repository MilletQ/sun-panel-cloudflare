name = "sun-panel-cloudflare-service"
main = "src/index.ts"
compatibility_date = "2026-05-09"

[vars]
CORS_ORIGIN = "*"
R2_PUBLIC_BASE_URL = "https://your-r2-public-domain.example.com"
VERSION_NAME = "1.3.0"
VERSION_CODE = "10"

[[d1_databases]]
binding = "DB"
database_name = "sun-panel"
database_id = "replace-with-your-d1-database-id"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "replace-with-your-kv-namespace-id"
preview_id = "replace-with-your-preview-kv-namespace-id"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "sun-panel-uploads"
preview_bucket_name = "sun-panel-uploads-preview"
